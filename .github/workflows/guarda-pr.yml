name: Guarda da Plataforma ERA

# Auto-merge protegido em toda a Plataforma ERA (atos da Arquiteta de 10/10/2026). ARQUIVO GERADO por
# guarda/montar_guarda.py a partir de guarda/: não edite aqui. Três selos (commit statuses) por PR:
#   revisor-independente  sessão nova do Claude contra as invariantes dos produtos tocados (o núcleo sempre entra);
#   trava-de-risco        o que desliga o auto-merge e põe espera-arquiteta; libera com liberado-pela-arquiteta,
#                         posta pela conta da Arquiteta; commit novo tira a etiqueta;
#   ordem-da-pilha        base no ramo principal, migrações em ordem.
# Os scripts e as listas vão embutidos neste arquivo (): o repositório que chama não lê nada do PR para
# decidir, e o gatilho é pull_request_target: vale sempre a versão do ramo principal, nunca a que o PR traz. Ações fixadas por SHA (a etiqueta fica no comentário).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, auto_merge_enabled]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

env:
  R: ${{ github.repository }}
  REPO_NOME: ${{ github.event.repository.name }}
  REPO_ID: ${{ github.event.repository.id }}
  N: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BASE_NOME: ${{ github.event.pull_request.base.ref }}
  PRINCIPAL: ${{ github.event.repository.default_branch }}
  ACAO: ${{ github.event.action }}
  ARQUITETA: ${{ vars.ARQUITETA_LOGIN || 'tatianeoliveira-consultoria' }}
  LIBERACAO_LOGIN: ${{ vars.LIBERACAO_LOGIN || 'era-liberacao[bot]' }}
  RODADA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}
  PACOTE: 

jobs:
  trava:
    name: trava de risco e ordem
    # só PR aberto de dentro do próprio repositório: PR de fork (de fora da organização) não roda com segredo nem
    # token de escrita; fica sem os selos e não entra
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: guarda-trava-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # o workflow vem do ramo principal (pull_request_target); do PR só se lê o diff, nada do PR é executado
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Guarda embutida
        run: mkdir -p /tmp/guarda && echo "$PACOTE" | base64 -d | tar -xz -C /tmp/guarda
      - name: Trava de risco e ordem da pilha
        run: |
          # o código do PR só é lido por git, dentro de pr/; nenhum programa do PR roda (python isolado com -I)
          cd "$GITHUB_WORKSPACE/pr"
          set +e
          python3 -I /tmp/guarda/ordem_da_pilha.py "$BASE_NOME" "$BASE_SHA" "$SHA" "$PRINCIPAL" | tee /tmp/ordem.txt
          ORDEM=${PIPESTATUS[0]}
          python3 -I /tmp/guarda/trava_de_risco.py "$BASE_SHA" "$SHA" --repo "$REPO_NOME" --json /tmp/trava.json | tee /tmp/trava.txt
          TRAVA=${PIPESTATUS[0]}
          set -e
          selo() { gh api "repos/$R/statuses/$SHA" -f state="$1" -f context="$2" -f description="$(echo "$3" | cut -c1-140)" -f target_url="$RODADA" > /dev/null; }
          if [ "$ORDEM" = 0 ]; then selo success ordem-da-pilha "na vez: base no $PRINCIPAL e migrações em ordem"
          else selo failure ordem-da-pilha "$(sed -n 2p /tmp/ordem.txt | cut -c3-)"; fi
          gh label create espera-arquiteta -R "$R" --color B79FD6 --description "Trava de risco: o PR espera pela Arquiteta" 2>/dev/null || true
          gh label create liberado-pela-arquiteta -R "$R" --color 1E8449 --description "Só a Arquiteta põe: libera a trava de risco" 2>/dev/null || true
          # commit novo (ou PR reaberto) tira a liberação: a etiqueta presente sempre veio depois do último commit
          if [ "$ACAO" = synchronize ] || [ "$ACAO" = reopened ]; then
            gh pr edit "$N" -R "$R" --remove-label liberado-pela-arquiteta > /dev/null 2>&1 || true
          fi
          if [ "$TRAVA" = 0 ]; then
            selo success trava-de-risco "nada a esperar: o auto-merge segue"
            gh pr edit "$N" -R "$R" --remove-label espera-arquiteta > /dev/null 2>&1 || true
          else
            gh pr edit "$N" -R "$R" --add-label espera-arquiteta > /dev/null || true
            # a liberação vale para um CONTEÚDO: o botão Liberar lote (aplicativo ERA Liberação, que só existe dentro do
            # GitHub) grava um comentário de texto fixo com a impressão do conteúdo do PR (git patch-id do diff); trazer o
            # PR para o ramo principal não muda o conteúdo e a liberação segue valendo; mudar uma linha pede liberação nova.
            # Só vale comentário desse aplicativo, nunca editado.
            PID=$(gh pr diff "$N" -R "$R" | git patch-id --stable | cut -d' ' -f1)
            export PID
            QUANDO=$(gh api "repos/$R/issues/$N/comments" --paginate --jq '.[] | select(.user.login == env.LIBERACAO_LOGIN and .updated_at == .created_at and (.body | gsub("\r"; "") | rtrimstr("\n")) == ("<!-- guarda:liberado conteudo:" + env.PID + " -->\nLiberado pela Arquiteta (botão Liberar lote) para o conteúdo `" + env.PID[0:12] + "`.")) | .created_at' | tail -1)
            CATS=$(jq -r '.nomes | join("; ")' /tmp/trava.json)
            if [ -n "$QUANDO" ]; then
              selo success trava-de-risco "liberado pela Arquiteta em $QUANDO para o conteúdo ${PID:0:12}"
            else
              gh pr merge "$N" -R "$R" --disable-auto > /dev/null 2>&1 || true
              selo failure trava-de-risco "espera pela Arquiteta: $CATS"
            fi
            {
              echo "<!-- guarda:trava -->"
              echo "<!-- categorias:$(jq -r '.categorias | map(tostring) | join(",")' /tmp/trava.json) -->"
              echo "### Trava de risco: este PR espera pela Arquiteta"
              echo
              echo "O auto-merge fica desligado. Toca: **$CATS**."
              echo
              echo "A Arquiteta libera pelo botão Liberar lote, que grava a liberação para o conteúdo deste PR (trazer o PR para o ramo principal não a desfaz)."
              echo
              echo '<details><summary>Onde</summary>'
              echo
              echo '```'
              sed -n '2,80p' /tmp/trava.txt
              echo '```'
              echo '</details>'
            } > /tmp/comentario.md
            ID=$(gh api "repos/$R/issues/$N/comments" --paginate --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == env.ARQUITETA) and (.body | contains("<!-- guarda:trava -->"))) | .id' | tail -1)
            if [ -n "$ID" ]; then gh api -X PATCH "repos/$R/issues/comments/$ID" -F body=@/tmp/comentario.md > /dev/null
            else gh pr comment "$N" -R "$R" --body-file /tmp/comentario.md > /dev/null; fi
          fi
      - name: Atualiza o Lote de liberação
        if: always()
        env:
          GUARDA_TOKEN: ${{ secrets.GUARDA_TOKEN }}
        run: |
          [ -n "$GUARDA_TOKEN" ] || { echo "sem GUARDA_TOKEN: o lote se atualiza na rodada agendada"; exit 0; }
          GH_TOKEN="$GUARDA_TOKEN" gh workflow run lote.yml -R plataformaera/.github-private > /dev/null 2>&1 || true

  revisor:
    name: revisor independente
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && (github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'auto_merge_enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: guarda-revisor-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # o workflow vem do ramo principal (pull_request_target); do PR só se lê o diff, nada do PR é executado
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Nomes sigilosos
        env:
          TERMOS_VEDADOS: ${{ secrets.TERMOS_VEDADOS }}
        run: |
          # núcleo 9: linha nova, mensagem de commit, título ou corpo do PR; a lista é segredo da organização (uma
          # expressão por linha), só este passo a vê, e ela nunca aparece no log nem no comentário
          [ -n "$TERMOS_VEDADOS" ] || exit 0
          cd "$GITHUB_WORKSPACE/pr"
          printf '%s\n' "$TERMOS_VEDADOS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/termos.txt"
          { git diff "$BASE_SHA...$SHA" | grep '^+' | grep -v '^+++'; git log --format=%B "$BASE_SHA..$SHA"; gh pr view "$N" -R "$R" --json title,body --jq '.title + "\n" + .body'; } > "$RUNNER_TEMP/novo.txt"
          if grep -i -E -q -f "$RUNNER_TEMP/termos.txt" "$RUNNER_TEMP/novo.txt"; then
            rm -f "$RUNNER_TEMP/termos.txt"
            gh api "repos/$R/statuses/$SHA" -f state=failure -f context=revisor-independente -f description="nome sigiloso no PR (lista da organização): o PR espera pela Arquiteta" -f target_url="$RODADA" > /dev/null
            echo "nome sigiloso achado (o termo não é mostrado)"; exit 1
          fi
          rm -f "$RUNNER_TEMP/termos.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Sessão nova do Claude contra as invariantes dos produtos tocados
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MUDOU_BASE: ${{ github.event.changes.base != null }}
          GUARDA_REVISOR: ${{ vars.GUARDA_REVISOR }}
        run: |
          mkdir -p /tmp/guarda && echo "$PACOTE" | base64 -d | tar -xz -C /tmp/guarda
          # do PR só se lê o diff, por git, dentro de pr/; node e npm rodam só em /tmp/sdk, nunca na pasta do PR
          cd "$GITHUB_WORKSPACE/pr"
          selo() { gh api "repos/$R/statuses/$SHA" -f state="$1" -f context=revisor-independente -f description="$(echo "$2" | cut -c1-140)" -f target_url="$RODADA" > /dev/null; }
          # edição de título ou corpo não muda o diff: só a troca de base chama o revisor de novo
          if [ "$ACAO" = edited ] && [ "$MUDOU_BASE" != true ]; then
            gh api "repos/$R/commits/$SHA/statuses" --jq '.[].context' | grep -q '^revisor-independente$' && { echo "diff igual"; exit 0; }
          fi
          git diff --name-only "$BASE_SHA...$SHA" > /tmp/mudou.txt
          python3 -I /tmp/guarda/produtos.py "$REPO_NOME" /tmp/mudou.txt > /tmp/produtos.json
          if jq -e '.erro' /tmp/produtos.json > /dev/null; then selo failure "$(jq -r .erro /tmp/produtos.json)"; exit 1; fi
          PRODUTOS=$(jq -r '.produtos | join(", ")' /tmp/produtos.json)
          git diff -U30 --no-color "$BASE_SHA...$SHA" -- . ':(exclude)package-lock.json' ':(exclude)*.lock' > /tmp/pr.diff
          HASH=$(sha256sum /tmp/pr.diff | cut -c1-16)
          # o mesmo diff (ex.: PR trazido para o principal sem mudança própria) aproveita o veredito, sem nova consulta
          # só vale o comentário que a própria guarda gravou (robô da nuvem ou conta da Arquiteta, pelo revisor do Mac);
          # o veredito só se reaproveita de comentário que ninguém editou depois de gravado
          ID=$(gh api "repos/$R/issues/$N/comments" --paginate --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == env.ARQUITETA) and (.body | contains("<!-- guarda:revisor -->"))) | .id' | tail -1)
          ANTES=""; TOTAL_ANTES=0
          if [ -n "$ID" ] && [ "$(gh api "repos/$R/issues/comments/$ID" --jq '.updated_at == .created_at')" = true ]; then
            ANTES=$(gh api "repos/$R/issues/comments/$ID" --jq .body)
            TOTAL_ANTES=$(echo "$ANTES" | sed -n 's/.*<!-- custo_total:\([0-9.]*\) -->.*/\1/p' | head -1); TOTAL_ANTES=${TOTAL_ANTES:-0}
            if echo "$ANTES" | grep -q "<!-- diff:$HASH -->"; then
              V=$(echo "$ANTES" | sed -n 's/.*<!-- veredito:\([a-z]*\) -->.*/\1/p' | head -1)
              [ "$V" = aprovado ] && selo success "aprovado (mesmo diff já revisado): $PRODUTOS" || selo failure "reprovado (mesmo diff já revisado)"
              [ "$V" = aprovado ]; exit $?
            fi
          fi
          # revisor no Mac (variável GUARDA_REVISOR=local da organização): enquanto a API está sem crédito, a revisão é
          # feita no Claude Code do Mac (guarda/revisor_local.py), com o mesmo selo e o mesmo comentário; aqui o PR só
          # fica em espera, e o veredito do Mac para o mesmo diff (acima) é reaproveitado
          if [ "$GUARDA_REVISOR" = local ]; then
            selo pending "aguarda o revisor independente no Mac: $PRODUTOS"
            echo "revisor no Mac: o PR espera o veredito de lá"; exit 0
          fi
          selo pending "lendo o diff contra: $PRODUTOS"
          mkdir -p /tmp/sdk && cp /tmp/guarda/revisor_independente.mjs /tmp/sdk/
          if [ -n "$ANTHROPIC_API_KEY" ]; then (cd /tmp/sdk && npm install --no-save --ignore-scripts @anthropic-ai/sdk@0.128.0 > /dev/null); fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then (cd /tmp/sdk && npm install --no-save --ignore-scripts @anthropic-ai/claude-code@2.1.283 > /dev/null); fi
          mapfile -t LISTAS < <(jq -r '.listas[]' /tmp/produtos.json)
          DADO=$(jq -r 'if .dado_pessoal then "1" else "0" end' /tmp/produtos.json)
          set +e
          (cd /tmp/sdk && DADO_PESSOAL=$DADO CLAUDE_BIN=/tmp/sdk/node_modules/.bin/claude node /tmp/sdk/revisor_independente.mjs /tmp/pr.diff /tmp/veredito.json "${LISTAS[@]}")
          FIM=$?
          set -e
          [ -s /tmp/veredito.json ] || echo '{"veredito":"reprovado","motivo":"o revisor parou sem veredito","invariantes":[],"custo_usd":0,"tentativa_de_orientar":{"houve":false,"trechos":[]}}' > /tmp/veredito.json
          V=$(jq -r '.veredito' /tmp/veredito.json); M=$(jq -r '.motivo' /tmp/veredito.json)
          C=$(jq -r '.custo_usd // 0' /tmp/veredito.json); TOTAL=$(python3 -c "print(round($TOTAL_ANTES + $C, 4))")
          ALERTA=$(jq -r '.tentativa_de_orientar.houve // false' /tmp/veredito.json)
          ESTADO=$([ "$V" = aprovado ] && [ "$FIM" = 0 ] && echo success || echo failure)
          selo "$ESTADO" "$V ($PRODUTOS): $M"
          {
            echo "<!-- guarda:revisor -->"
            echo "<!-- diff:$HASH -->"
            echo "<!-- veredito:$V -->"
            echo "<!-- produtos:$(jq -r '.produtos | join(",")' /tmp/produtos.json) -->"
            echo "<!-- custo_total:$TOTAL -->"
            echo "### Revisor independente: **$(echo "$V" | tr a-z A-Z)**"
            echo
            echo "Commit \`${SHA:0:7}\`. Listas: $PRODUTOS. Motivo: $M"
            if [ "$ALERTA" = true ]; then
              echo
              echo "**Alerta:** texto no diff tenta orientar o revisor:"
              jq -r '.tentativa_de_orientar.trechos[] | "- `\(.)`"' /tmp/veredito.json
            fi
            echo
            jq -r '.invariantes[] | "- \(.lista) \(.numero): \(.situacao). \(.evidencia)"' /tmp/veredito.json
            echo
            echo "Custo desta revisão: US\$ $C (acumulado no PR: US\$ $TOTAL)."
          } > /tmp/comentario.md
          # comentário novo a cada veredito: só comentário nunca editado vale para reaproveitar
          gh pr comment "$N" -R "$R" --body-file /tmp/comentario.md > /dev/null
          if [ "$ALERTA" = true ]; then
            gh label create alerta-revisor -R "$R" --color C0392B --description "Texto no diff tentou orientar o revisor" 2>/dev/null || true
            gh pr edit "$N" -R "$R" --add-label alerta-revisor > /dev/null || true
          fi
          [ "$ESTADO" = success ]
