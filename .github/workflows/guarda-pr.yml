name: Guarda da Plataforma ERA

# Merge protegido em toda a Plataforma ERA (atos da Arquiteta de 10/10/2026; decisão de 13/10/2026: o revisor
# independente é a autoridade final de merge; ela não revisa, não libera lote e não clica). ARQUIVO GERADO por
# guarda/montar_guarda.py a partir de guarda/: não edite aqui. Três selos (commit statuses) por PR:
#   revisor-independente  sessão nova do Claude contra as invariantes dos produtos tocados (o núcleo sempre entra); com
#                         três "reprovado" no PR (selos dos commits e comentários, vale o maior; a conta não zera) ou 4
#                         horas em correção desde a primeira reprovação, o PR para; a etiqueta parado-no-limite é só aviso;
#   trava-de-risco        categorias 1 a 7 e 9 só marcam (success, etiqueta risco-marcado, resumo diário); a categoria 8,
#                         correção honesta, bloqueia (failure) sem chamar ninguém;
#   ordem-da-pilha        base no ramo principal, migrações em ordem.
# A guarda só grava selos e comentários: não liga o auto-merge nem faz merge (decisão de 13/10/2026, opção A da fase
# Mac). Quem mescla é o guarda/mesclador.py, rodado pelo launchd do Mac a partir de um clone novo do main: ele decide
# pelo registro local do revisor e recalcula a trava e a ordem; selo e comentário não são critério (guarda/LEIA-ME.md).
# Os scripts e as listas vão embutidos neste arquivo (pacote base64): o repositório que chama não lê nada do PR para
# decidir, e o gatilho é pull_request_target: vale sempre a versão do ramo principal, nunca a que o PR traz. Por isso
# mudança na guarda ou no revisor só entra com o revisor da versão do main aprovando. Ações fixadas por SHA (a etiqueta
# fica no comentário).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, auto_merge_enabled]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

env:
  R: ${{ github.repository }}
  REPO_NOME: ${{ github.event.repository.name }}
  REPO_ID: ${{ github.event.repository.id }}
  N: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BASE_NOME: ${{ github.event.pull_request.base.ref }}
  PRINCIPAL: ${{ github.event.repository.default_branch }}
  ACAO: ${{ github.event.action }}
  # o login do aplicativo ERA Automação (revisor do Mac), fixo: nunca de variável que alguém troque
  REVISOR_LOGIN: era-automacao[bot]
  RODADA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # a versão do que o revisor lê da guarda (decisões, invariantes, pedido e revisor), gravada por montar_guarda.py: o
  # veredito de "mesmo diff já revisado" só se reaproveita de revisão feita com esta mesma versão
  GUARDA_VERSAO: d787e2e75a46a364
  GH_TOKEN: ${{ github.token }}
  PACOTE: 

jobs:
  trava:
    name: trava de risco e ordem
    # só PR aberto de dentro do próprio repositório: PR de fork (de fora da organização) não roda com segredo nem
    # token de escrita; fica sem os selos e não entra
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: guarda-trava-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # o workflow vem do ramo principal (pull_request_target); do PR só se lê o diff, nada do PR é executado
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Guarda embutida
        run: mkdir -p /tmp/guarda && echo "$PACOTE" | base64 -d | tar -xz -C /tmp/guarda
      - name: Trava de risco e ordem da pilha
        run: |
          # o código do PR só é lido por git, dentro de pr/; nenhum programa do PR roda (python isolado com -I)
          cd "$GITHUB_WORKSPACE/pr"
          set +e
          python3 -I /tmp/guarda/ordem_da_pilha.py "$BASE_NOME" "$BASE_SHA" "$SHA" "$PRINCIPAL" | tee /tmp/ordem.txt
          ORDEM=${PIPESTATUS[0]}
          python3 -I /tmp/guarda/trava_de_risco.py "$BASE_SHA" "$SHA" --repo "$REPO_NOME" --json /tmp/trava.json | tee /tmp/trava.txt
          TRAVA=${PIPESTATUS[0]}
          set -e
          selo() { gh api "repos/$R/statuses/$SHA" -f state="$1" -f context="$2" -f description="$(echo "$3" | cut -c1-140)" -f target_url="$RODADA" > /dev/null; }
          if [ "$ORDEM" = 0 ]; then selo success ordem-da-pilha "na vez: base no $PRINCIPAL e migrações em ordem"
          else selo failure ordem-da-pilha "$(sed -n 2p /tmp/ordem.txt | cut -c3-)"; fi
          gh label create risco-marcado -R "$R" --color B79FD6 --description "Trava de risco: marcado para o resumo diário" 2>/dev/null || true
          # o fluxo de espera e liberação pela Arquiteta acabou (decisão de 13/10/2026): saem as etiquetas antigas
          gh pr edit "$N" -R "$R" --remove-label espera-arquiteta > /dev/null 2>&1 || true
          gh pr edit "$N" -R "$R" --remove-label liberado-pela-arquiteta > /dev/null 2>&1 || true
          # 0: nada ou só marcação; 1: correção honesta; outro código ou sem JSON: a trava não leu tudo e vale o bloqueio
          if [ "$TRAVA" = 0 ] && [ -s /tmp/trava.json ]; then HONESTA=""
          elif [ "$TRAVA" = 1 ] && [ -s /tmp/trava.json ]; then HONESTA=$(jq -r '.correcao_honesta | join("; ")' /tmp/trava.json)
          else HONESTA="a trava não terminou a leitura do diff"; echo '{"marcadas":[],"nomes_marcadas":[],"correcao_honesta":[]}' > /tmp/trava.json; fi
          CATS=$(jq -r '.nomes_marcadas | join("; ")' /tmp/trava.json)
          if [ -n "$HONESTA" ]; then
            # correção honesta: bloqueia sem chamar ninguém; quem escreveu corrige no próprio PR
            gh pr merge "$N" -R "$R" --disable-auto > /dev/null 2>&1 || true
            selo failure trava-de-risco "correção honesta: $HONESTA"
          elif [ -n "$CATS" ]; then
            selo success trava-de-risco "marcado: $CATS"
          else
            selo success trava-de-risco "nada a marcar"
          fi
          if [ -n "$CATS" ]; then gh pr edit "$N" -R "$R" --add-label risco-marcado > /dev/null || true
          else gh pr edit "$N" -R "$R" --remove-label risco-marcado > /dev/null 2>&1 || true; fi
          ID=$(gh api "repos/$R/issues/$N/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- guarda:trava -->"))) | .id' | tail -1)
          [ -n "$HONESTA" ] || [ -n "$CATS" ] || [ -n "$ID" ] || exit 0
          {
            echo "<!-- guarda:trava -->"
            echo "<!-- categorias:$(jq -r '.marcadas | map(tostring) | join(",")' /tmp/trava.json) -->"
            echo "<!-- honesta:$([ -n "$HONESTA" ] && echo sim || echo nao) -->"
            if [ -n "$HONESTA" ]; then
              echo "### Trava de risco: correção honesta"
              echo
              echo "Este PR não entra enquanto retirar ou enfraquecer teste, invariante, trava do banco, regra de acesso, a guarda ou o revisor: **$HONESTA**."
              echo
              echo "Ninguém é chamado: quem escreveu corrige no próprio PR, e a trava confere de novo a cada commit."
            fi
            if [ -n "$CATS" ]; then
              echo
              echo "### Trava de risco: marcação para o resumo diário"
              echo
              echo "Este PR toca: **$CATS**. É marcação, não bloqueio: o PR entra com o revisor independente aprovando, a trava sem correção honesta e a ordem da pilha em dia, e aparece no resumo diário."
            fi
            if [ -z "$HONESTA" ] && [ -z "$CATS" ]; then
              echo "### Trava de risco: nada a marcar"
              echo
              echo "Neste commit (\`${SHA:0:7}\`), nada a marcar."
            fi
            echo
            echo '<details><summary>Onde</summary>'
            echo
            echo '```'
            sed -n '2,80p' /tmp/trava.txt
            echo '```'
            echo '</details>'
          } > /tmp/comentario.md
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$R/issues/comments/$ID" -F body=@/tmp/comentario.md > /dev/null
          else gh pr comment "$N" -R "$R" --body-file /tmp/comentario.md > /dev/null; fi

  revisor:
    name: revisor independente
    # mudança de etiqueta não chama o revisor: tirar parado-no-limite não destrava nada (a conta vem dos comentários)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'auto_merge_enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: guarda-revisor-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # o workflow vem do ramo principal (pull_request_target); do PR só se lê o diff, nada do PR é executado
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Limite de três reprovações ou 4 horas
        id: limite
        run: |
          mkdir -p /tmp/guarda && echo "$PACOTE" | base64 -d | tar -xz -C /tmp/guarda
          # com três "reprovado" no PR (contados a cada rodada nos selos de todos os commits e nos comentários; vale o
          # maior; a conta não zera) o revisor não roda; sem ler os selos ou os comentários, vale parado. A etiqueta
          # parado-no-limite é só aviso e não entra na conta.
          if [ "$(python3 -I /tmp/guarda/comum.py parado "$R" "$N")" != nao ]; then
            gh api "repos/$R/statuses/$SHA" -f state=failure -f context=revisor-independente -f description="parado: três reprovações ou 4 horas em correção" -f target_url="$RODADA" > /dev/null
            echo "parado=sim" >> "$GITHUB_OUTPUT"
            echo "parado (três reprovações ou 4 horas em correção): o revisor não roda mais neste PR"
          fi
      - name: Nomes sigilosos
        if: steps.limite.outputs.parado != 'sim'
        env:
          TERMOS_VEDADOS: ${{ secrets.TERMOS_VEDADOS }}
        run: |
          # núcleo 9: linha nova, mensagem de commit, título ou corpo do PR; a lista é segredo da organização (uma
          # expressão por linha), só este passo a vê, e ela nunca aparece no log nem no comentário
          [ -n "$TERMOS_VEDADOS" ] || exit 0
          cd "$GITHUB_WORKSPACE/pr"
          printf '%s\n' "$TERMOS_VEDADOS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/termos.txt"
          { git diff "$BASE_SHA...$SHA" | grep '^+' | grep -v '^+++'; git log --format=%B "$BASE_SHA..$SHA"; gh pr view "$N" -R "$R" --json title,body --jq '.title + "\n" + .body'; } > "$RUNNER_TEMP/novo.txt"
          if grep -i -E -q -f "$RUNNER_TEMP/termos.txt" "$RUNNER_TEMP/novo.txt"; then
            rm -f "$RUNNER_TEMP/termos.txt"
            gh api "repos/$R/statuses/$SHA" -f state=failure -f context=revisor-independente -f description="nome sigiloso no PR (lista da organização): o PR não entra até o nome sair" -f target_url="$RODADA" > /dev/null
            echo "nome sigiloso achado (o termo não é mostrado)"; exit 1
          fi
          rm -f "$RUNNER_TEMP/termos.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.limite.outputs.parado != 'sim'
        with:
          node-version: 22
      - name: Sessão nova do Claude contra as invariantes dos produtos tocados
        if: steps.limite.outputs.parado != 'sim'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MUDOU_BASE: ${{ github.event.changes.base != null }}
          GUARDA_REVISOR: ${{ vars.GUARDA_REVISOR }}
        run: |
          mkdir -p /tmp/guarda && echo "$PACOTE" | base64 -d | tar -xz -C /tmp/guarda
          # do PR só se lê o diff, por git, dentro de pr/; node e npm rodam só em /tmp/sdk, nunca na pasta do PR
          cd "$GITHUB_WORKSPACE/pr"
          selo() { gh api "repos/$R/statuses/$SHA" -f state="$1" -f context=revisor-independente -f description="$(echo "$2" | cut -c1-140)" -f target_url="$RODADA" > /dev/null; }
          # edição de título ou corpo não muda o diff: só a troca de base chama o revisor de novo
          if [ "$ACAO" = edited ] && [ "$MUDOU_BASE" != true ]; then
            # só conta selo gravado pela guarda (github-actions[bot]) ou pelo revisor do Mac (era-automacao[bot])
            gh api "repos/$R/commits/$SHA/statuses" --paginate --jq '.[] | select(.creator.login == "github-actions[bot]" or .creator.login == env.REVISOR_LOGIN) | .context' | grep -q '^revisor-independente$' && { echo "diff igual"; exit 0; }
          fi
          git diff --name-only "$BASE_SHA...$SHA" > /tmp/mudou.txt
          python3 -I /tmp/guarda/produtos.py "$REPO_NOME" /tmp/mudou.txt > /tmp/produtos.json
          if jq -e '.erro' /tmp/produtos.json > /dev/null; then selo failure "$(jq -r .erro /tmp/produtos.json)"; exit 1; fi
          PRODUTOS=$(jq -r '.produtos | join(", ")' /tmp/produtos.json)
          git diff -U30 --no-color "$BASE_SHA...$SHA" -- . ':(exclude)package-lock.json' ':(exclude)*.lock' > /tmp/pr.diff
          HASH=$(sha256sum /tmp/pr.diff | cut -c1-16)
          # o mesmo diff (ex.: PR trazido para o principal sem mudança própria) aproveita o veredito, sem nova consulta
          # só se reaproveita veredito gravado pelo aplicativo ERA Automação (revisor do Mac), nunca editado: comentário
          # do robô comum do GitHub não vale, porque qualquer workflow do repositório escreve com esse nome
          ID=$(gh api "repos/$R/issues/$N/comments" --paginate --jq '.[] | select(.user.login == env.REVISOR_LOGIN and (.body | contains("<!-- guarda:revisor -->"))) | .id' | tail -1)
          ANTES=""; TOTAL_ANTES=0
          if [ -n "$ID" ] && [ "$(gh api "repos/$R/issues/comments/$ID" --jq '.updated_at == .created_at')" = true ]; then
            ANTES=$(gh api "repos/$R/issues/comments/$ID" --jq .body)
            TOTAL_ANTES=$(echo "$ANTES" | sed -n 's/.*<!-- custo_total:\([0-9.]*\) -->.*/\1/p' | head -1); TOTAL_ANTES=${TOTAL_ANTES:-0}
            # o mesmo diff só reaproveita o veredito (aprovado ou reprovado) se a revisão de origem leu a mesma versão
            # da guarda: decisões, invariantes ou pedido novos no main pedem revisão nova (pedido de 13/10/2026)
            if echo "$ANTES" | grep -q "<!-- diff:$HASH -->" && echo "$ANTES" | grep -qF "<!-- guarda_versao:$GUARDA_VERSAO -->"; then
              V=$(echo "$ANTES" | sed -n 's/.*<!-- veredito:\([a-z]*\) -->.*/\1/p' | head -1)
              [ "$V" = aprovado ] && selo success "aprovado (mesmo diff já revisado): $PRODUTOS" || selo failure "reprovado (mesmo diff já revisado)"
              [ "$V" = aprovado ]; exit $?
            fi
            if echo "$ANTES" | grep -q "<!-- diff:$HASH -->"; then echo "mesmo diff, revisado com outra versão da guarda: revisão nova"; fi
          fi
          # revisor no Mac (variável GUARDA_REVISOR=local da organização): enquanto a API está sem crédito, a revisão é
          # feita no Claude Code do Mac (guarda/revisor_local.py), com o mesmo selo e o mesmo comentário; aqui o PR só
          # fica em espera, e o veredito do Mac para o mesmo diff (acima) é reaproveitado
          if [ "$GUARDA_REVISOR" = local ]; then
            selo pending "aguarda o revisor independente no Mac: $PRODUTOS"
            echo "revisor no Mac: o PR espera o veredito de lá"; exit 0
          fi
          selo pending "lendo o diff contra: $PRODUTOS"
          mkdir -p /tmp/sdk && cp /tmp/guarda/revisor_independente.mjs /tmp/sdk/
          if [ -n "$ANTHROPIC_API_KEY" ]; then (cd /tmp/sdk && npm install --no-save --ignore-scripts @anthropic-ai/sdk@0.128.0 > /dev/null); fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then (cd /tmp/sdk && npm install --no-save --ignore-scripts @anthropic-ai/claude-code@2.1.283 > /dev/null); fi
          mapfile -t LISTAS < <(jq -r '.listas[]' /tmp/produtos.json)
          DADO=$(jq -r 'if .dado_pessoal then "1" else "0" end' /tmp/produtos.json)
          set +e
          (cd /tmp/sdk && DECISOES=/tmp/guarda/decisoes DADO_PESSOAL=$DADO CLAUDE_BIN=/tmp/sdk/node_modules/.bin/claude node /tmp/sdk/revisor_independente.mjs /tmp/pr.diff /tmp/veredito.json "${LISTAS[@]}")
          FIM=$?
          set -e
          [ -s /tmp/veredito.json ] || echo '{"veredito":"reprovado","motivo":"o revisor parou sem veredito","invariantes":[],"custo_usd":0,"tentativa_de_orientar":{"houve":false,"trechos":[]}}' > /tmp/veredito.json
          V=$(jq -r '.veredito' /tmp/veredito.json); M=$(jq -r '.motivo' /tmp/veredito.json)
          C=$(jq -r '.custo_usd // 0' /tmp/veredito.json); TOTAL=$(python3 -c "print(round($TOTAL_ANTES + $C, 4))")
          ALERTA=$(jq -r '.tentativa_de_orientar.houve // false' /tmp/veredito.json)
          ESTADO=$([ "$V" = aprovado ] && [ "$FIM" = 0 ] && echo success || echo failure)
          selo "$ESTADO" "$V ($PRODUTOS): $M"
          {
            echo "<!-- guarda:revisor -->"
            echo "<!-- diff:$HASH -->"
            echo "<!-- commit:$SHA -->"
            echo "<!-- guarda_versao:$GUARDA_VERSAO -->"
            echo "<!-- veredito:$V -->"
            echo "<!-- produtos:$(jq -r '.produtos | join(",")' /tmp/produtos.json) -->"
            echo "<!-- custo_total:$TOTAL -->"
            echo "<!-- custo:$C -->"
            echo "### Revisor independente: **$(echo "$V" | tr a-z A-Z)**"
            echo
            echo "Commit \`${SHA:0:7}\`. Listas: $PRODUTOS. Motivo: $M"
            if [ "$ALERTA" = true ]; then
              echo
              echo "**Alerta:** texto no diff tenta orientar o revisor:"
              jq -r '.tentativa_de_orientar.trechos[] | "- `\(.)`"' /tmp/veredito.json
            fi
            echo
            jq -r '.invariantes[] | "- \(.lista) \(.numero): \(.situacao). \(.evidencia)"' /tmp/veredito.json
            echo
            echo "Custo desta revisão: US\$ $C (acumulado no PR: US\$ $TOTAL)."
          } > /tmp/comentario.md
          # comentário novo a cada veredito: só comentário nunca editado vale para reaproveitar
          gh pr comment "$N" -R "$R" --body-file /tmp/comentario.md > /dev/null
          if [ "$ALERTA" = true ]; then
            gh label create alerta-revisor -R "$R" --color C0392B --description "Texto no diff tentou orientar o revisor" 2>/dev/null || true
            gh pr edit "$N" -R "$R" --add-label alerta-revisor > /dev/null || true
          fi
          # decisão de 13/10/2026: com três "reprovado" no PR desde a criação (aprovado não zera), o PR para
          if [ "$ESTADO" != success ]; then python3 -I /tmp/guarda/comum.py limite "$R" "$N" "$SHA" || true; fi
          [ "$ESTADO" = success ]
