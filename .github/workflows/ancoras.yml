name: Âncoras do ERA Impacto

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ancoras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/buscar.mjs
      - name: Confere o formato antes de gravar (só número, data, hashes e carimbos)
        run: node scripts/conferir_formato.mjs
      - name: Grava as âncoras novas
        run: |
          git config user.name "era-impacto-ancoras"
          git config user.email "contato@plataformaera.com"
          git add ancoras ancoras.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "nada novo"; else git commit -m "Âncoras do ERA Impacto em $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
